name: Nix Flake Check

on:
  pull_request:
    branches: [ main ]
  # thor upgrades itself from main every night, and the format workflow
  # pushes there directly, so check what actually lands on it too.
  push:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install Determinate Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: true
          
      - name: Run nix flake check
        run: nix flake check
        
      - name: Report success
        if: success()
        run: echo "✅ Nix flake check passed"
        
      - name: Report failure
        if: failure()
        run: |
          echo "❌ Nix flake check failed"
          exit 1